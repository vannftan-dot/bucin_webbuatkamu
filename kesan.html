<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Notes</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-card { background: var(--glass); border: 1px solid var(--glass-border); padding: 30px; border-radius: 20px; max-width: 500px; width: 100%; margin-bottom: 40px; }
        .mood-selector { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .mood-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); width: 60px; height: 60px; border-radius: 50%; cursor: pointer; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .mood-btn:hover { transform: scale(1.1); }
        .mood-btn.active { background: var(--primary); border-color: #fff; box-shadow: 0 0 15px var(--primary-glow); transform: scale(1.1); }
        #notesList { max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .note-item { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); padding: 15px 20px; border-radius: 20px 20px 20px 5px; text-align: left; animation: popIn 0.5s ease; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .note-header { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .note-name { color: var(--primary); font-weight: 600; }
        .note-text { color: #e0e0e0; line-height: 1.5; font-size: 0.95rem; margin-top: 5px; }
        #toast { visibility: hidden; min-width: 250px; background: linear-gradient(45deg, #ff4d8d, #ff9a9e); color: white; text-align: center; border-radius: 30px; padding: 16px; position: fixed; z-index: 9999; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(100px); font-weight: 600; box-shadow: 0 5px 25px rgba(255, 77, 141, 0.6); opacity: 0; transition: all 0.5s ease; }
        #toast.show { visibility: visible; transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
    <audio id="bgMusic" loop><source src="bukancintabiasa.mp3" type="audio/mpeg"></audio>
    <button id="musicBtn" onclick="toggleMusic()">🎵</button>

    <nav>
        <a href="index.html">Home</a>
        <a href="story.html">Story</a>
        <a href="alasan.html">Alasan</a>
        <a href="kuis.html">Kuis</a>
        <a href="pesan.html">Pesan</a>
        <a href="kesan.html" class="active">Buku Tamu</a>
    </nav>

    <section>
        <h1>Love Notes & Mood 💌</h1>
        <div class="form-card">
            <form id="loveForm">
                <input type="text" id="nama" placeholder="Nama Kamu" required>
                <p style="font-size: 0.9rem; color: #ffc0cb; margin-top: 10px;">Pilih Mood Kamu Hari Ini:</p>
                <div class="mood-selector">
                    <div class="mood-btn active" data-mood="😄 Senang">😄</div>
                    <div class="mood-btn" data-mood="🥺 Rindu">🥺</div>
                    <div class="mood-btn" data-mood="😠 Ngambek">😠</div>
                    <div class="mood-btn" data-mood="😍 Jatuh Cinta">😍</div>
                </div>
                <input type="hidden" id="moodValue" value="😄 Senang" required>
                <textarea id="pesanText" placeholder="Tulis pesan cintamu di sini..." required></textarea>
                <button type="submit">Kirim Pesan ✈️</button>
            </form>
        </div>
        <div id="notesList"></div>
        <div style="margin-top: 40px;">
            <button onclick="resetDatabase()" style="background: rgba(255,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.8rem;">🗑️ Reset Buku Tamu</button>
        </div>
        <a href="index.html" class="next-btn">Balik ke Awal <span>⬆️</span></a>
    </section>

    <div id="toast">Pesan cintanya udah aman sampai di hati aku! 💌</div>

    <script src="script.js"></script>
    <script>
        // Logika Buku Tamu Pakai LocalStorage (Khusus GitHub)
        const moodBtns = document.querySelectorAll('.mood-btn');
        const moodValue = document.getElementById('moodValue');
        moodBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                moodBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                moodValue.value = btn.dataset.mood;
            });
        });

        function showToast(pesan) {
            const toast = document.getElementById("toast");
            toast.innerText = pesan;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function loadNotes() {
            const notes = JSON.parse(localStorage.getItem('loveNotes')) || [];
            const list = document.getElementById('notesList');
            
            if (notes.length === 0) {
                list.innerHTML = '<p style="color: rgba(255,255,255,0.5); font-style: italic;">Belum ada pesan nih, jadi yang pertama kirim cinta ya!</p>';
                return;
            }

            list.innerHTML = '';
            notes.reverse().forEach(note => {
                list.innerHTML += `
                    <div class="note-item">
                        <div class="note-header">
                            <span class="note-name">${note.nama}</span>
                            <span class="note-mood">${note.mood}</span>
                        </div>
                        <p class="note-text">${note.pesan}</p>
                    </div>
                `;
            });
        }

        document.getElementById('loveForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nama = document.getElementById('nama').value;
            const mood = document.getElementById('moodValue').value;
            const pesan = document.getElementById('pesanText').value;
            
            const notes = JSON.parse(localStorage.getItem('loveNotes')) || [];
            notes.push({ nama, mood, pesan });
            localStorage.setItem('loveNotes', JSON.stringify(notes));
            
            showToast("Pesan cintanya udah aman sampai di hati aku! 💌");
            
            document.getElementById('loveForm').reset();
            moodBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('.mood-btn[data-mood="😄 Senang"]').classList.add('active');
            moodValue.value = "😄 Senang";
            
            loadNotes();
        });

        function resetDatabase() {
            if (confirm("Yakin mau hapus SEMUA pesan buku tamu?")) {
                localStorage.removeItem('loveNotes');
                loadNotes();
            }
        }

        loadNotes();
    </script>
</body>
</html>
